<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BARSA OS</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>

<div id="boot-screen">
    <div id="arcade-frame">

        <h1>BARSA OS</h1>

        <p id="edition">
            Developer Arcade Edition
        </p>

        <div id="pacman-layer">
            <div id="pacman-drop">
                <img
                    id="pacman"
                    src="./assets/arcade/svg/pacman.svg"
                    alt="Pac-Man">
            </div>
        </div>

        <div id="mini-container"></div>

        <p id="press-start">
            PRESS START
        </p>

        <div id="terminal-line">
            <pre id="boot-text"></pre>
        </div>

    </div>
</div>

<!-- Core Engines -->
<script src="./engine/sceneManager.js"></script>
<script src="./engine/pacman.js"></script>
<script src="./engine/terminal.js"></script>

<!-- Scenes -->
<script src="./engine/scenes/introScene.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        window.sceneManager.register("intro", window.introScene);
        window.sceneManager.register("terminal", window.terminalScene);
        window.sceneManager.switchTo("intro");
    });
</script>
</body>
</html>
