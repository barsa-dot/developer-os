<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARSA OS — Interactive Portfolio</title>
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<div id="boot-screen">
    <div id="arcade-frame">

        <!-- HUD Header -->
        <header id="arcade-hud">
            <div class="hud-item">1UP <span id="score">00</span></div>
            <h1 id="game-title">BARSA.DOT</h1>
            <div class="hud-item">HIGH <span id="high-score">10000</span></div>
        </header>

        <!-- Main Game Arena Container -->
        <div id="arcade-arena">
            <div id="maze-layer"></div>
            <div id="pellet-layer"></div>
            <div id="character-layer">
                <img id="pacman" src="./assets/arcade/svg/pacman.svg" alt="Pac-Man">
            </div>
        </div>

        <!-- Status Bar & Terminal -->
        <footer id="status-bar">
            <span id="press-start">PRESS START</span>
            <div id="terminal-line">
                <pre id="boot-text"></pre>
            </div>
        </footer>

    </div>
</div>

<!-- ========================================= -->
<!-- 1. CORE ENGINE MODULES (Phase 1)           -->
<!-- ========================================= -->
<script src="./engine/sceneManager.js"></script>
<script src="./engine/audio.js"></script>
<script src="./engine/maze.js"></script>
<script src="./engine/pellets.js"></script>
<script src="./engine/pacman.js"></script>
<script src="./engine/ghosts.js"></script>

<!-- ========================================= -->
<!-- 2. DISCOVERY & DASHBOARD (Phases 2 & 3)    -->
<!-- ========================================= -->
<script src="./engine/github.js"></script>
<script src="./engine/identity.js"></script>
<script src="./engine/skills.js"></script>
<script src="./engine/repositories.js"></script>
<script src="./engine/activity.js"></script>
<script src="./engine/achievements.js"></script>
<script src="./engine/logoFormation.js"></script>
<script src="./engine/dashboardTransform.js"></script>
<script src="./engine/renderDashboard.js"></script>
<script src="./engine/activityCenter.js"></script>
<script src="./engine/repositoryShowcase.js"></script>

<!-- ========================================= -->
<!-- 3. INTERACTIVE SYSTEM (Phase 4)            -->
<!-- ========================================= -->
<script src="./engine/interactiveTerminal.js"></script>
<script src="./engine/commands.js"></script>
<script src="./engine/autocomplete.js"></script>
<script src="./engine/history.js"></script>
<script src="./engine/themes.js"></script>
<script src="./engine/audioControls.js"></script>
<script src="./engine/responsive.js"></script>

<!-- ========================================= -->
<!-- 4. POLISH & EASTER EGGS (Phase 5)          -->
<!-- ========================================= -->
<script src="./engine/crtShader.js"></script>
<script src="./engine/particles.js"></script>
<script src="./engine/optimizer.js"></script>
<script src="./engine/a11y.js"></script>
<script src="./engine/konami.js"></script>
<script src="./engine/miniGame.js"></script>
<script src="./engine/achievementPopup.js"></script>
<script src="./engine/easterEggs.js"></script>

<!-- ========================================= -->
<!-- 5. TERMINAL & SCENES                      -->
<!-- ========================================= -->
<script src="./engine/terminal.js"></script>
<script src="./engine/scenes/introScene.js"></script>

<!-- ========================================= -->
<!-- BOOT ORCHESTRATOR & EVENT LISTENERS        -->
<!-- ========================================= -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        // 1. Initialize Visual Effects & Accessibility
        if (window.crtShaderEngine) window.crtShaderEngine.init();
        if (window.a11yEngine) window.a11yEngine.init();
        if (window.konamiEngine) window.konamiEngine.listen();

        // 2. Render Maze and Pellets
        if (window.mazeEngine) window.mazeEngine.render();
        if (window.pelletEngine) window.pelletEngine.generate();

        // 3. Initialize Character Engines
        if (window.pacmanEngine) {
            window.pacmanEngine.init();
            if (typeof window.pacmanEngine.startPatrol === 'function') {
                window.pacmanEngine.startPatrol();
            }
        }

        if (window.ghostEngine) {
            window.ghostEngine.spawn();
            if (typeof window.ghostEngine.startPatrol === 'function') {
                window.ghostEngine.startPatrol();
            }
        }

        // 4. Initialize Phase 4 Terminal Interactivity
        if (window.interactiveTerminal) {
            window.interactiveTerminal.init();
            const cliInput = document.getElementById("cli-input");
            if (cliInput) {
                if (window.autocompleteEngine) window.autocompleteEngine.attach(cliInput);
                if (window.commandHistoryEngine) window.commandHistoryEngine.attach(cliInput);
            }
        }
        
        if (window.responsiveEngine) window.responsiveEngine.init();

        // 5. Register Scenes and Kick off Boot Sequence
        if (window.sceneManager) {
            if (window.introScene) window.sceneManager.register("intro", window.introScene);
            if (window.terminalScene) window.sceneManager.register("terminal", window.terminalScene);
            window.sceneManager.switchTo("intro");
        }
    });
</script>
</body>
</html>
