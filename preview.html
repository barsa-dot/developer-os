<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARSA OS — Interactive Portfolio</title>
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<div id="boot-screen">
    <div id="arcade-frame">

        <!-- HUD Header -->
        <header id="arcade-hud">
            <div class="hud-item">1UP <span id="score">00</span></div>
            <h1 id="game-title">BARSA.DOT</h1>
            <div class="hud-item">HIGH <span id="high-score">10000</span></div>
        </header>

        <!-- Main Game Arena Container -->
        <div id="arcade-arena">
            <div id="maze-layer"></div>
            <div id="pellet-layer"></div>
            <div id="character-layer">
                <img id="pacman" src="./assets/arcade/svg/pacman.svg" alt="Pac-Man" style="display:none;">
            </div>

            <!-- Insert Coin Overlay -->
            <div id="insert-coin-overlay" style="position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:50; cursor:pointer;">
                <h2 style="color:#FFFF00; font-family:'Press Start 2P'; font-size:16px; animation: blink 1s infinite; margin-bottom:20px;">INSERT COIN</h2>
                <p style="color:#00FF00; font-family:monospace; font-size:12px;">CLICK ANYWHERE TO START</p>
            </div>
        </div>

        <!-- Dashboard Grid Overlay Container -->
        <div id="dashboard-container" style="display:none;">
            <div id="widget-profile" class="widget-box"></div>
            <div id="widget-repos" class="widget-box"></div>
            <div id="widget-activity" class="widget-box"></div>
            <div id="widget-achievements" class="widget-box"></div>
        </div>

        <!-- Status Bar & Terminal -->
        <footer id="status-bar">
            <div id="terminal-line">
                <pre id="boot-text">> SYSTEM READY. AWAITING COIN INSERTION...</pre>
            </div>
            
            <div id="cli-box" style="display:none;">
                <span style="color:#FFFF00; font-weight:bold; margin-right:8px;">visitor@barsa-os:~$</span>
                <input type="text" id="cli-input" placeholder="type 'help'..." autocomplete="off">
            </div>
        </footer>

    </div>
</div>

<!-- ========================================= -->
<!-- CORE ENGINE MODULES                       -->
<!-- ========================================= -->
<script src="./engine/sceneManager.js"></script>
<script src="./engine/audio.js"></script>
<script src="./engine/maze.js"></script>
<script src="./engine/pellets.js"></script>
<script src="./engine/pacman.js"></script>
<script src="./engine/ghosts.js"></script>

<!-- DISCOVERY & DASHBOARD -->
<script src="./engine/github.js"></script>
<script src="./engine/identity.js"></script>
<script src="./engine/skills.js"></script>
<script src="./engine/repositories.js"></script>
<script src="./engine/activity.js"></script>
<script src="./engine/achievements.js"></script>
<script src="./engine/logoFormation.js"></script>
<script src="./engine/dashboardTransform.js"></script>
<script src="./engine/renderDashboard.js"></script>
<script src="./engine/activityCenter.js"></script>
<script src="./engine/repositoryShowcase.js"></script>

<!-- INTERACTIVE SYSTEM -->
<script src="./engine/interactiveTerminal.js"></script>
<script src="./engine/commands.js"></script>
<script src="./engine/autocomplete.js"></script>
<script src="./engine/history.js"></script>
<script src="./engine/themes.js"></script>
<script src="./engine/audioControls.js"></script>
<script src="./engine/responsive.js"></script>

<!-- POLISH & SHADERS -->
<script src="./engine/crtShader.js"></script>
<script src="./engine/particles.js"></script>
<script src="./engine/optimizer.js"></script>
<script src="./engine/a11y.js"></script>
<script src="./engine/konami.js"></script>
<script src="./engine/miniGame.js"></script>
<script src="./engine/achievementPopup.js"></script>
<script src="./engine/easterEggs.js"></script>

<!-- TERMINAL & SCENES -->
<script src="./engine/terminal.js"></script>
<script src="./engine/scenes/introScene.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Prepare global visual hooks
        if (window.crtShaderEngine) window.crtShaderEngine.init();
        if (window.a11yEngine) window.a11yEngine.init();
        if (window.konamiEngine) window.konamiEngine.listen();

        const overlay = document.getElementById("insert-coin-overlay");
        overlay.addEventListener("click", () => {
            overlay.style.display = "none";
            if (window.introScene) window.introScene.enter();
        });
    });
</script>
</body>
</html>
