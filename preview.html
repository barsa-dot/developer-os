<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BARSA OS</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>

<div id="boot-screen">
    <div id="arcade-frame">

        <!-- HUD Header -->
        <header id="arcade-hud">
            <div class="hud-item">1UP<span id="score">00</span></div>
            <h1 id="game-title">BARSA.DOT</h1>
            <div class="hud-item">HIGH<span id="high-score">10000</span></div>
        </header>

        <!-- Main Game Arena Container -->
        <div id="arcade-arena">
            <div id="maze-layer"></div>
            <div id="pellet-layer"></div>
            <div id="character-layer">
                <img id="pacman" src="./assets/arcade/svg/pacman.svg" alt="Pac-Man">
            </div>
        </div>

        <!-- Status Bar & Terminal -->
        <footer id="status-bar">
            <span id="press-start">PRESS START</span>
            <div id="terminal-line">
                <pre id="boot-text"></pre>
            </div>
        </footer>

    </div>
</div>

<!-- Core Engine Modules -->
<script src="./engine/sceneManager.js"></script>
<script src="./engine/audio.js"></script>
<script src="./engine/maze.js"></script>
<script src="./engine/pellets.js"></script>
<script src="./engine/pacman.js"></script>
<script src="./engine/ghosts.js"></script>

<!-- Phase 2 & 3 Discovery/Dashboard Engines -->
<script src="./engine/github.js"></script>
<script src="./engine/logoFormation.js"></script>
<script src="./engine/dashboardTransform.js"></script>
<script src="./engine/renderDashboard.js"></script>
<script src="./engine/activityCenter.js"></script>
<script src="./engine/repositoryShowcase.js"></script>

<!-- Terminal & Scenes -->
<script src="./engine/terminal.js"></script>
<script src="./engine/scenes/introScene.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (window.mazeEngine) window.mazeEngine.render();
        if (window.pelletEngine) window.pelletEngine.generate();

        if (window.pacmanEngine) {
            window.pacmanEngine.init();
            window.pacmanEngine.startPatrol();
        }

        if (window.ghostEngine) {
            window.ghostEngine.spawn();
            window.ghostEngine.startPatrol();
        }

        // Register scenes
        window.sceneManager.register("intro", window.introScene);
        window.sceneManager.register("terminal", window.terminalScene);
        window.sceneManager.switchTo("intro");
    });
</script>
</body>
</html>
